<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>定位範例</title>
    <!-- 拿掉這一行，就會變回使用真實定位 -->
    <script src="geo-mock.js"></script>
    <style>
        body { margin: 0; padding: 24px 16px; font-family: system-ui, sans-serif; background: #fff; color: #1d2330; }
        @media (prefers-color-scheme: dark) { body { background: #11141a; color: #e6e8ec; } }
        #where { font-size: 1.4rem; font-weight: bold; }
    </style>
</head>
<body>
    <h1>我在哪裡？</h1>
    <p>這是一個「普通的」定位網頁，只多載入了 geo-mock.js。去控制面板改位置，這裡會跟著變。</p>
    <p id="where">定位中…</p>

    <script>
        // 一般的定位寫法，完全不用改
        navigator.geolocation.watchPosition(
            (pos) => {
                const { latitude, longitude } = pos.coords;
                document.getElementById('where').textContent =
                    '緯度 ' + latitude + '，經度 ' + longitude;
            },
            (err) => {
                document.getElementById('where').textContent = '定位失敗：' + err.message;
            }
        );
    </script>
</body>
</html>
